services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: locoomo
      POSTGRES_PASSWORD: locoomo
      POSTGRES_DB: locoomo
    ports:
      # 5434, not 5432/5433 — this machine already has a native Postgres service
      # on 5432 and another project's container on 5433. Adjust freely if your
      # setup differs, just keep .env's DATABASE_URL in sync.
      - '5434:5432'
    volumes:
      - locoomo_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U locoomo -d locoomo']
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional locally — set REDIS_URL=redis://localhost:6381/0 to use it.
  # Required in production once more than one API instance runs.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # 6381: 6379/6380 are already taken on this machine by other projects.
      - '6381:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  locoomo_postgres_data:
